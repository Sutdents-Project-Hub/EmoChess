# EmoChess Backend - 歷史 Coolify Compose 模板
# 現行正式為 backend/Dockerfile 的獨立 API 與 PostgreSQL 18.6 resource。
# 不得用本模板重建正式資料庫或接上正式資料卷；維護依 maintenance.md。
# ─────────────────────────────────────────
# 在 Coolify 上使用步驟：
# 1. 建立新的 Docker Compose 服務
# 2. 指向此 repo 或上傳此檔案
# 3. 在 Coolify UI 設定環境變數（將下方 ${VARIABLE} 替換為實際值）
# 4. 部署

services:
  # ─── PostgreSQL 資料庫 ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emochess_db}
      POSTGRES_USER: ${POSTGRES_USER:-emochess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - emochess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emochess} -d ${POSTGRES_DB:-emochess_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js API 服務 ──────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-emochess}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-emochess_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      GLOBAL_RATE_LIMIT_WINDOW_MS: ${GLOBAL_RATE_LIMIT_WINDOW_MS:-900000}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX:-300}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AI_API_KEY: ${AI_API_KEY:-${OPENAI_API_KEY:-}}
      AI_BASE_URL: ${AI_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com}}
      AI_MODEL: ${AI_MODEL:-${OPENAI_MODEL:-gpt-4o-mini}}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_RATE_LIMIT_WINDOW_MS: ${AI_RATE_LIMIT_WINDOW_MS:-60000}
      AI_RATE_LIMIT_MAX: ${AI_RATE_LIMIT_MAX:-30}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  emochess_pgdata:
